<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
        .liststyle{
            background-color: aqua;
            padding: 10px;
            margin:0px;
            top: 0px;
            border: 0px;
            position:sticky;
            width: 100%;
        }

       .liststyle ul{
    margin: 0;
    padding: 10px;
    list-style: none;
    display: flex;
justify-content: center;
    gap: 20px;
}

        .liststyle li{
            color: brown;
            font-size: 18px;
            cursor: pointer;
        }

        .liststyle li:hover{
            color: yellow;
        }
    </style>
</head>
<body>

    <nav class="liststyle">
        <ul>
            <li>Home</li>
            <li>About Us</li>
            <li>Contact Us</li>
        </ul>
    </nav>

</body>
</html>
